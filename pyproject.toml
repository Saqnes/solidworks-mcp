[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-mcp"
version = "0.1.0"
description = "MCP server that drives SOLIDWORKS through its COM API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pillow>=10",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
solidworks-mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "sw"]
